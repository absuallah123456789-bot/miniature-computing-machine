[package]
name = "cheslan"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MalikHw47"]

[lib]
name = "cheslan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cheslan-core = { path = "../crates/cheslan-core" }
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "macros", "rt"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
rand = "0.8"
base64 = "0.22"
