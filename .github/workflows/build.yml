name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cheslan-core --release

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            globs: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            name: linux
            globs: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: cheslan-${{ matrix.name }}
          path: ${{ matrix.globs }}
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # No SDK/NDK install step: ubuntu-latest already ships the Android SDK and NDK.
      # Tauri only needs NDK_HOME pointing at the preinstalled NDK.
      - name: Point Tauri at the preinstalled NDK
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK: $NDK"
          test -d "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Generate application icons
        run: npm run icons

      - name: Generate Android project (Tauri) and patch it
        run: |
          npm run tauri -- android init --ci
          python3 scripts/patch_android.py

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build release APK and AAB
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npm run tauri -- android build --apk --aab

      - name: Collect outputs
        run: |
          mkdir -p dist-android
          find src-tauri/gen/android/app/build/outputs -path '*elease*' -name '*.apk' -exec cp {} dist-android/cheslan-release.apk \; -quit
          find src-tauri/gen/android/app/build/outputs -path '*elease*' -name '*.aab' -exec cp {} dist-android/cheslan-release.aab \; -quit
          ls -la dist-android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist-android/cheslan-release.apk

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: dist-android/cheslan-release.aab
